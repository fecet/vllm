[workspace]
authors = ["fecet <xiezej@gmail.com>"]
channels = ["https://repo.prefix.dev/meta-forge", "conda-forge"]
name = "vllm"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]
build = "rattler-build build -r recipe/recipe.yaml -v --experimental --keep-build --no-build-id"

[dependencies]
rattler-build = "*"
sccache = "*"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[activation.env]
SCCACHE_CACHE_SIZE = "100G"
